<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | TechNest</title>
  <link rel="icon" href="../assets/icons/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/cart.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a href="../index.html" class="logo">
      <img src="../assets/images/technest-logo.png" alt="TechNest home">
    </a>
    <button id="menu-button" type="button" aria-expanded="false" aria-controls="navigation">Menu ☰</button>
    <nav id="navigation" aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="../pages/products.html" aria-current="page">Products</a>
      <a href="../pages/favorites.html">Favorites (<span id="favorite-count">0</span>)</a>
      <a href="../pages/cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="../pages/admin.html">Admin</a>
    </nav>
  </header>

   <main id="main">
      <section class="userCart">
        <h1>Your bag.</h1>
      </section>
      <section class="user-cart">
        <div id="bag"></div>
        <div id="cart-empty" class="empty-state" hidden>
          <div class="empty-icon">&#9633;</div>
          <h2>Nothing saved yet</h2>
          <p>Check our product catalogue in here</p>
          <a href="products.html" class="button primary">Explore our products</a>
        </div>
      </section>
    
        <aside class="order-summary" id="order-summary">
          <h2>Order summary</h2>
          <div class="summary-row">
            <span>Items</span><span id="cart-count-detail">0</span>
          </div>
          <div class="summary-row"><span>Shipping</span><span>Free</span></div>
          <div class="summary-row total">
            <strong>Total</strong><strong id="cart-total">$0.00</strong>
          </div>
          <button class="button primary full" id="checkout" type="button">
            Place simulated order &#8594;
          </button>
        </aside>
      </section>
      <div class="user-order">
        <div
          id="order-confirmation"
          role="status"
          aria-live="polite"
          hidden
        ></div>
      </div>
    </main>
</body>
</html>
