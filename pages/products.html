<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../js/products.js"></script>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="shortcut icon" href="#">
    <title>Products | TechNest</title>
</head>
<body>
<header>
    <nav>
    <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="product.html">Product</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="admin.html">Admin</a></li>
    </ul>
</nav>
</header>
    <main>
        <!-- Filters panel aside -->
    <section class="products-catalogue">
    <aside class="filters aside">
        <h2>Personalize your search</h2>
        <label for="search">Search products</label>
          <input type="search" id="search" placeholder="Search by name...">
            
        <label for="category">Category</label>
            <select id="category">
                <option value="all"> All electronics</option>
                <option value="smartphones">Smartphones</option>
                <option value="laptops">Laptops</option>
                <option value="tablets">Tablets</option>
                <option value="mobile-accessories">Accessories</option>
            </select>  

            <label for="sort">Sort by</label>
            <select id="sort">
                <option value="default">Sort by price</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
            </select>
            <button class="reset btn" id="reselt-filters" type="button">Clear filters ↺</button>
        </aside>               

    <div class="catalogue-main">
        <h2>All products <span id="result-count"></span></h2>
    </div>
    <div class="products"></div>
    </section>
</main>
<footer>
    <p>&copy; 2026 TechNest. All rights reserved.</p>    
</footer>
</body>
</html>
