<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | TechNest</title>
  <link rel="icon" href="../assets/icons/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/main.js" defer></script>
  <script src="../js/products.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a href="../index.html" class="logo">
      <img src="../assets/images/technest-logo.png" alt="TechNest home">
    </a>
    <button id="menu-button" type="button" aria-expanded="false" aria-controls="navigation">Menu ☰</button>
    <nav id="navigation" aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="../pages/products.html" aria-current="page">Products</a>
      <a href="../pages/favorites.html">Favorites</a>
      <a href="../pages/cart.html">Cart</a>
      <a href="../pages/admin.html">Admin</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <h1>Our products</h1>
    <p>Find the right technology by name, category and price.</p>

    <form id="catalog-form" role="search" aria-label="Search and filter products">
      <fieldset id="filters" class="filters" disabled>
        <legend>Search and filter</legend>
        <label for="search">Search products
          <input id="search" type="search" placeholder="Search by name">
        </label>
        <label for="category">Category
          <select id="category">
            <option value="">All categories</option>
            <option value="laptops">Laptops</option>
            <option value="smartphones">Smartphones</option>
            <option value="tablets">Tablets</option>
            <option value="mobile-accessories">Accessories</option>
          </select>
        </label>
        <label for="sort">Sort by
          <select id="sort">
            <option value="default">Default</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
          </select>
        </label>
        <button id="clear" type="button">Clear</button>
      </fieldset>
    </form>

    <section aria-label="Products">
      <p id="status" role="status">Loading products…</p>
      <button id="retry" type="button" hidden>Try again</button>
      <div id="product-list" class="product-grid" aria-busy="true"></div>
    </section>
  </main>
  <footer>
    <strong>TechNest</strong>
    <p>School project · Prices in USD · No real purchases</p>
  </footer>
  <noscript>Enable JavaScript to view the products.</noscript>
</body>
</html>
